<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Links</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      padding-top: 50px;
      background-color: #f4f4f4;
    }
    .btn {
      display: inline-block;
      text-decoration: none;
      color: #ffffff;
      background-color: #007bff;
      padding: 12px 24px;
      margin: 10px;
      border-radius: 6px;
      font-size: 18px;
      font-weight: bold;
    }
    .btn:hover {
      background-color: #0056b3;
    }
  </style>
</head>
<body>

  <h1>My Links</h1>

  <div>
    <a class="btn" href="https://www.youtube.com" target="_blank">YouTube</a>
  </div>

  <div>
    <a class="btn" href="https://limewire.com/d/I83Xw#1uZI3wwu3l">castle</a>
  </div>

</body>
</html>
